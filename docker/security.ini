; Mitigations for CVE-2026-109618 (RCE via OOM corruption) and
; CVE-2026-109619 (RCE via stale global state).
; https://www.php.net/archive/2026.php#2026-10-21-5
;
; These settings block the attack paths the PHP security team confirmed. They
; reduce exposure; they do not make an installation safe. The complete fix is
; PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 or newer.
;
; Every directive below is PHP_INI_PERDIR, so it must be set here rather than
; through ini_set() at runtime.

; CVE-2026-109619 - stale global state. Session upload progress is the
; confirmed path, and it has to be off before request parsing starts.
session.upload_progress.enabled = 0

; Stop a directory-level .user.ini from overriding the settings on this page.
user_ini.filename =

; CVE-2026-109618 - OOM corruption while request data is only partly
; initialized. Keep upload_max_filesize below post_max_size.
post_max_size = 32M
upload_max_filesize = 8M

; PHP 8.5 only - blocks the confirmed fatal backtrace path. Unknown to older
; releases, where PHP ignores it.
; Trade-off: fatal errors no longer print backtraces, which costs debugging
; detail in a test image. Delete this line to restore them.
fatal_error_backtraces = 0

; Deliberately not set: memory_limit = -1 removes the controllable OOM trigger,
; but without a cgroup or container memory boundary it lets a runaway request
; exhaust the host. Enable it per pool once such a boundary exists.
;memory_limit = -1
